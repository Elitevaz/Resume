---
- name: Deploy Automated Professional Resume Website
  hosts: resume_servers
  become: true

  tasks:
    - name: Update apt software package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx Web Server
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx is running and starts on boot
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Transfer index.html directly from Mac to AWS Nginx folder
      copy:
        src: ./index.html
        dest: /var/www/html/index.html
        mode: '0644'
